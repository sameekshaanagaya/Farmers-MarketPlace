<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Product</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            padding: 40px 20px;
        }
        form {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #007bff;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .not-authorized {
            max-width: 400px;
            margin: 80px auto;
            background: #fff4f4;
            border: 1px solid #ffa0a0;
            color: #c00;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    {% if session.get('role') == 'seller' %}
<form method="POST" enctype="multipart/form-data">
  <h2>Add New Product</h2>

  <label for="item_name">Item Name:</label>
  <input type="text" id="item_name" name="item_name" required>

  <label for="category">Category:</label>
  <input type="text" id="category" name="category" required placeholder="E.g. Vegetables">

  <label for="quantity">Quantity:</label>
  <input type="number" id="quantity" name="quantity" min="0" required>
  <label for="price">Price (₹):</label>
<input type="number" id="price" name="price" step="1" required>

<label for="description">Description:</label>
<input type="text" id="description" name="description" maxlength="255">

  <label for="image_file">Product Image:</label>
  <input type="file" id="image_file" name="image_file" accept="image/*" capture="environment"><br> <br>
  <button type="submit">Add Product</button>
  <a href="{{ url_for('farmer_dashboard') }}" class="back-link">Back to Dashboard</a>
</form>
    {% else %}
    <div class="not-authorized">
        <strong>Not authorized.</strong><br>
        Only admins can add new products.
        <a href="{{ url_for('category_view', category='groceries') }}" class="back-link">Back to Categories</a>
    </div>
    {% endif %}
</body>
</html>
