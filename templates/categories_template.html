<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ category_name }} Products</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .products-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .product-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      width: 250px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0 5px;
    }

    .product-desc {
      font-size: 14px;
      color: #555;
    }

    .product-price {
      margin-top: 8px;
      font-weight: bold;
      color: #007bff;
    }

    .product-qty {
      font-size: 14px;
      margin-top: 4px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .back-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <button onclick="window.location.href='/categories'" class="back-btn">← Back to Categories</button>
  <h1>{{ category_name }} Products</h1>
  <div class="products-grid">
    {% for product in products %}
    <div class="product-card">
      <a href="{{ url_for('single_product', product_id=product['Product ID']) }}">
      <img src="{{ url_for('static', filename=product['Image URL'].replace('static/', '')) }}" alt="{{ product['Product Name'] }}"></a>
      <div class="product-name">{{ product['Product Name'] }}</div>
      <div class="product-desc">{{ product['Description'] }}</div>
      <div class="product-price">₹{{ product['Price (INR/kg/ltr)'] }}</div>
      <div class="product-qty">Available: {{ product['Quantity Available'] }}</div>
      <form action="{{ url_for('add_to_cart') }}" method="POST">
  <input type="hidden" name="product_id" value="{{ product['Product ID'] }}">
  <input type="number" name="quantity" min="1" max="{{ product['Quantity Available'] }}" value="1" required>
  <button type="submit">Add to Cart</button>
</form>
    </div>
    {% endfor %}
  </div>
</body>
</html>
